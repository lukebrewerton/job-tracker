#
# CI: lint, test and build every PR to main, and re-run on every push to main.
#
# The push-to-main run is what gates deploys: Render (render.yaml: autoDeployTrigger:
# checksPass) deploys a main commit only after EVERY check on it passes, and never a
# commit with no checks. So each merge is re-verified on main before it can go live.
#
# Security rules (see CLAUDE.md):
#   - Never pull_request_target: fork PRs must never run with secrets or a write token.
#   - This workflow references NO secrets. Nothing here can leak regardless of PR code.
#   - Least privilege: no permissions by default, read-only contents per job.
#   - Third-party actions pinned to full commit SHAs (Dependabot keeps them current).
#
# Job names are the required status checks on main — keep them stable.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs always finish, so every merged commit
  # gets a definitive result (a cancelled check would count as a failure for deploys).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint-api

  test-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Throwaway database for the tests. Same image + digest as compose.yaml. The
    # credentials are dummies that exist only inside this job — not secrets.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: ci-admin
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: jobtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci-admin -d jobtracker"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # The tests run as a non-superuser, non-BYPASSRLS role (created below), exactly as
      # the app must in production — otherwise row-level security isn't enforced and the
      # isolation tests would prove nothing.
      DATABASE_URL: postgresql://jobtracker_app:ci-app-only@localhost:5432/jobtracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --frozen
      # Same SQL as docker/postgres/initdb (the service container can't mount it).
      - name: Create the app's database role
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U ci-admin -d jobtracker <<'SQL'
          CREATE ROLE jobtracker_app LOGIN PASSWORD 'ci-app-only'
            NOSUPERUSER NOBYPASSRLS NOCREATEROLE CREATEDB;
          ALTER DATABASE jobtracker OWNER TO jobtracker_app;
          SQL
      # Writes JUnit + Cobertura to reports/api/. Not published anywhere yet (later ticket).
      - run: make test-api

  lint-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make sync-web
      - run: make lint-web

  test-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Placeholder until Vitest lands (JT-30); kept so the required check name is stable.
      - run: make test-web

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
      # gitleaks via its official image, pinned by digest in the Makefile. No third-party
      # action, no token, no licence (gitleaks itself is MIT).
      - run: make secrets-scan
