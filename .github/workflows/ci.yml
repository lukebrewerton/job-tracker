#
# CI: lint, test and build every PR to main. Also callable from the deploy workflow
# (workflow_call) so main is re-verified before a deploy.
#
# Security rules (see CLAUDE.md):
#   - Never pull_request_target: fork PRs must never run with secrets or a write token.
#   - This workflow references NO secrets. Nothing here can leak regardless of PR code.
#   - Least privilege: no permissions by default, read-only contents per job.
#   - Third-party actions pinned to full commit SHAs (Dependabot keeps them current).
#
# Job names are the required status checks on main — keep them stable.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint-api

  test-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --frozen
      # Writes JUnit + Cobertura to reports/api/. Not published anywhere yet (later ticket).
      - run: make test-api

  lint-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make sync-web
      - run: make lint-web

  test-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Placeholder until Vitest lands (JT-30); kept so the required check name is stable.
      - run: make test-web

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
      # gitleaks via its official image, pinned by digest in the Makefile. No third-party
      # action, no token, no licence (gitleaks itself is MIT).
      - run: make secrets-scan
