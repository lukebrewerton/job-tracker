<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker</title>
    <style>
      /* Shown only until the app starts (React replaces #root's contents). Inline, because
         the app's own stylesheet may still be downloading. Fades in after 0.3s, so a
         fast connection never sees it flash. */
      .boot {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          1rem system-ui,
          sans-serif;
        color: #475569;
        background: #f8fafc;
        opacity: 0;
        animation: boot-in 0.2s ease-out 0.3s forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><p class="boot">Loading Job Tracker…</p></div>
    <noscript>Job Tracker needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
