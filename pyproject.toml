[project]
name = "job-tracker"
version = "0.1.0"
description = "Self-hostable, single-user job application tracker"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16",
]

# This is an application, not a library — uv manages the environment but does not
# build/install the project itself. `app/` is importable from the working directory.
[tool.uv]
package = false

# --- Ruff owns both linting and formatting. ---
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade,
# B = bugbear, C4 = comprehensions, SIM = simplify.

[tool.ruff.lint.isort]
# The repo's alembic/ migrations folder would otherwise make ruff treat the alembic
# package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates migrations; exempt them from import-order and line-length rules.
"alembic/versions/*.py" = ["I001", "E501"]

# --- Type checking: mypy, pragmatic to start. Tighten over time. ---
[tool.mypy]
python_version = "3.14"
files = ["app", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Deliberately not --strict yet. Flip these on per-package as the code settles:
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# package = false means app/ isn't installed; put the repo root on sys.path instead.
pythonpath = ["."]
# Async tests (DB): one event loop for the whole session, so session-scoped async
# fixtures (the test engine) and tests share it.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
